<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
  <h1 class="title" id="formTitle">Wejdź do Huba</h1>
  <p class="subtitle" id="formSubtitle">Zaloguj się, żeby zobaczyć listę zadań na imprezę.</p>

  <form id="authForm">
    <div>
      <label for="firstname">Imię</label>
      <input type="text" id="firstname" placeholder="Jan" required>
    </div>
    <div>
      <label for="lastname">Nazwisko</label>
      <input type="text" id="lastname" placeholder="Kowalski" required>
    </div>
    <div>
      <label for="password">Hasło</label>
      <input type="password" id="password" placeholder="min. 6 znaków" required minlength="6">
    </div>
    <button type="submit" class="primary" id="submitBtn">Zaloguj się</button>
    <div class="message" id="message"></div>
  </form>

  <div class="switch-mode">
    <span id="switchText">Nie masz konta?</span>
    <button type="button" id="switchBtn">Załóż konto</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    setPersistence,
    browserLocalPersistence,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  setPersistence(auth, browserLocalPersistence);

  let mode = "login"; // "login" | "signup"

  const form = document.getElementById("authForm");
  const firstnameInput = document.getElementById("firstname");
  const lastnameInput = document.getElementById("lastname");
  const passwordInput = document.getElementById("password");

  // Zamienia "Bartek Kowalski", "BARTEK KOWALSKI", "bartek kowałski" itd.
  // na ten sam identyfikator, żeby logowanie działało niezależnie od
  // wielkości liter i polskich znaków.
  function normalizeName(raw) {
    return raw
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "") // usuwa ogonki/akcenty (ą->a, ł zostaje osobno niżej)
      .replace(/ł/g, "l")
      .replace(/\s+/g, " ");
  }

  function nameToFakeEmail(raw) {
    const normalized = normalizeName(raw).replace(/\s+/g, "");
    return normalized + "@halloween-hub.local";
  }
  const submitBtn = document.getElementById("submitBtn");
  const messageEl = document.getElementById("message");
  const formTitle = document.getElementById("formTitle");
  const formSubtitle = document.getElementById("formSubtitle");
  const switchText = document.getElementById("switchText");
  const switchBtn = document.getElementById("switchBtn");

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = "message " + (type || "");
  }

  function setMode(newMode) {
    mode = newMode;
    showMessage("", "");
    if (mode === "login") {
      formTitle.textContent = "Wejdź do Huba";
      formSubtitle.textContent = "Zaloguj się, żeby zobaczyć listę zadań na imprezę.";
      submitBtn.textContent = "Zaloguj się";
      switchText.textContent = "Nie masz konta?";
      switchBtn.textContent = "Załóż konto";
    } else {
      formTitle.textContent = "Dołącz do ekipy";
      formSubtitle.textContent = "Załóż konto, żeby dostać dostęp do zadań.";
      submitBtn.textContent = "Załóż konto";
      switchText.textContent = "Masz już konto?";
      switchBtn.textContent = "Zaloguj się";
    }
  }

  switchBtn.addEventListener("click", () => {
    setMode(mode === "login" ? "signup" : "login");
  });

  function translateError(code) {
    const map = {
      "auth/invalid-email": "Wpisz imię i nazwisko (min. 2 znaki, bez samych cyfr).",
      "auth/email-already-in-use": "Ta osoba już ma konto — zaloguj się.",
      "auth/weak-password": "Hasło musi mieć min. 6 znaków.",
      "auth/user-not-found": "Nie ma konta na to imię i nazwisko — załóż je.",
      "auth/wrong-password": "Złe hasło.",
      "auth/invalid-credential": "Nie ma takiego konta albo złe hasło.",
      "auth/too-many-requests": "Za dużo prób. Spróbuj za chwilę."
    };
    return map[code] || "Coś poszło nie tak. Spróbuj ponownie.";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const rawName = firstnameInput.value.trim() + " " + lastnameInput.value.trim();
    const fakeEmail = nameToFakeEmail(rawName);
    const password = passwordInput.value;

    submitBtn.disabled = true;
    showMessage("", "");

    try {
      if (mode === "login") {
        await signInWithEmailAndPassword(auth, fakeEmail, password);
      } else {
        const cred = await createUserWithEmailAndPassword(auth, fakeEmail, password);
        // zapisujemy oryginalnie wpisaną pisownię, żeby ładnie wyświetlić w hubie
        await updateProfile(cred.user, { displayName: rawName.trim() });
      }
      // onAuthStateChanged przekieruje do huba
    } catch (err) {
      showMessage(translateError(err.code), "error");
      submitBtn.disabled = false;
    }
  });

  let redirected = false;
  onAuthStateChanged(auth, (user) => {
    if (user && !redirected) {
      redirected = true;
      window.location.replace("hub.html");
    }
  });

  setMode("login");
</script>
</body>
</html>
