<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
  <h1 class="title">Jesteś w środku</h1>
  <p class="subtitle" id="welcomeText">Zalogowano.</p>
  <p class="subtitle">Tu w następnym kroku pojawi się lista zadań na imprezę.</p>
  <button type="button" class="primary" id="logoutBtn">Wyloguj się</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  setPersistence(auth, browserLocalPersistence);

  let redirected = false;
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      if (!redirected) {
        redirected = true;
        window.location.replace("index.html");
      }
    } else {
      document.getElementById("welcomeText").textContent = "Zalogowano jako " + (user.displayName || user.email);
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth);
  });
</script>
</body>
</html>
